[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "yugen-saga-rl-server"
version = "0.1.0"
description = "WebSocket-to-ZeroMQ reinforcement-learning server for Yugen Saga"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=1.2,<2",
    "numpy>=2,<3",
    "PyYAML>=6,<7",
    "pyzmq>=27,<28",
    "tensorboard>=2.20,<3",
    "torch>=2.9,<3",
    "tyro>=0.9,<1",
    "wandb>=0.22,<1",
    "websockets>=16,<17",
]

[tool.setuptools.packages.find]
where = ["."]
namespaces = true
include = [
    "Automation*",
    "Custom_enviornments*",
    "Inference*",
    "Tests*",
    "Training*",
    "Utils*",
]

[tool.setuptools.package-data]
Custom_enviornments = ["Config.yaml"]
