# Automation config for running the bridge and selected RL algorithm together.
#
# The bridge starts first. The launcher waits until bridge_ready_signal appears
# in bridge output, then starts the configured algorithm command.

rl_algorithm: "ppo_lstm"
bridge_command:
  - python
  - -m
  - Automation.Bridge.ws_zmq_bridge
bridge_ready_signal: "WebSocket bridge listening"
ready_timeout_seconds: 30
start_tensorboard: true
tensorboard_command:
  - python
  - -m
  - Automation.tensorboard_server
  - --logdir
  - runs

dqn_command:
  - python
  - -m
  - Training.DQN_server

ppo_command:
  - python
  - -m
  - Training.PPO_server

ppo_lstm_command:
  - python
  - -m
  - Training.PPO_lstm_server

# Select dqn, ppo, or ppo_lstm independently from the training algorithm.
inference_algorithm: "ppo_lstm"

dqn_inference_command:
  - python
  - -m
  - Inference.dqn_eval
  - --model-path
  - runs/DQN_server__1783138095/DQN_server.pt

ppo_inference_command:
  - python
  - -m
  - Inference.ppo_eval
  - --model-path
  - runs/PPO_server.pt

ppo_lstm_inference_command:
  - python
  - -m
  - Inference.ppo_lstm_eval
  - --model-path
  - runs/PPO_lstm_server.pt
