# Automation config for running the bridge and selected RL algorithm together.
#
# The bridge starts first. The launcher waits until bridge_ready_signal appears
# in bridge output, then starts the configured algorithm command.

rl_algorithm: "ppo"

# Optional PPO/PPO-LSTM checkpoint used to initialize a new training run.
# The new run still saves to its own runs/<run_name>/ checkpoint.
# Example: runs/Env16__PPO_lstm_server__1__1234/PPO_lstm_server.pt
restore_model_path: null

# Full training-state resume for PPO/PPO-LSTM. Unlike restore_model_path, this
# restores optimizer, progress, original hyperparameters, and RNG state.
resume_checkpoint_path: null
# Optional safe-boundary controls. These can also be passed to RunRL.ps1.
total_timesteps: null
stop_after_timesteps: null
checkpoint_interval: null

bridge_command:
  - python
  - -m
  - Automation.Bridge.ws_zmq_bridge
bridge_ready_signal: "WebSocket bridge listening"
ready_timeout_seconds: 30
# Let recorders flush SQLite/Minari data after Ctrl+C before force cleanup.
interrupt_grace_seconds: 30
start_tensorboard: true
tensorboard_command:
  - python
  - -m
  - Automation.tensorboard_server
  - --logdir
  - runs

dqn_command:
  - python
  - -m
  - Training.DQN_server

ppo_command:
  - python
  - -m
  - Training.PPO_server

ppo_lstm_command:
  - python
  - -m
  - Training.PPO_lstm_server

# Offline recording uses the same bridge lifecycle as training and inference.
recorder_command:
  - python
  - -m
  - Offline.record_player

# Select dqn, ppo, or ppo_lstm independently from the training algorithm.
inference_algorithm: "ppo_lstm"

dqn_inference_command:
  - python
  - -m
  - Inference.dqn_eval
  - --model-path
  - runs/DQN_server__1783138095/DQN_server.pt

ppo_inference_command:
  - python
  - -m
  - Inference.ppo_eval
  - --model-path
  - runs/Env16__PPO_server__1__1785983258/PPO_server.pt

ppo_lstm_inference_command:
  - python
  - -m
  - Inference.ppo_lstm_eval
  - --model-path
  - runs/Env16__PPO_lstm_server__1__1785994846/PPO_lstm_server.pt
